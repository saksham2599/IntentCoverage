name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-checks:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Check repository hygiene and portability
        run: python3 scripts/check-repository.py
      - name: Test Swift package
        run: swift test --jobs 2
      - name: Verify source coverage and compile generated adapter
        run: python3 scripts/demo.py --build
      - name: Check patch formatting
        run: git diff --check
